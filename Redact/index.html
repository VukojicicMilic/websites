<!DOCTYPE html>
<html lang="en" data-theme="editorial">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redact</title>
<style>
:root,[data-theme=editorial]{--bg:#fff;--ed:#fff;--tx:#202020;--mu:#777;--red:#c41230;--redd:#9e1028;--sel:#f8e3e7;--bd:#e5e5e5;--tb:#fafafa}
[data-theme=midnight]{--bg:#15161a;--ed:#1a1b20;--tx:#e4e4e6;--mu:#8a8a92;--red:#ff5a70;--redd:#ff8093;--sel:#4a2530;--bd:#2c2d33;--tb:#1e1f24}
[data-theme=paper]{--bg:#f4efe6;--ed:#f8f4ec;--tx:#3b342b;--mu:#7d7263;--red:#a8321f;--redd:#86281a;--sel:#ecd9cc;--bd:#ddd3c2;--tb:#efe9dd}
[data-theme=contrast]{--bg:#000;--ed:#000;--tx:#fff;--mu:#e0e0e0;--red:#ff4d68;--redd:#ff8a9c;--sel:#6b1424;--bd:#fff;--tb:#000}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:14px/1.4 "Source Sans 3","Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:1px solid transparent;padding:4px 9px;cursor:pointer;border-radius:2px}
button:hover{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:1px}
header{display:flex;align-items:center;gap:6px;background:var(--tb);border-bottom:1px solid var(--bd);padding:0 8px;min-height:40px;flex-wrap:wrap}
.brand{font:700 19px Georgia,serif;display:flex;align-items:center;gap:7px;margin-right:8px}
.brand i{width:9px;height:9px;background:var(--red);display:inline-block}
#tabs{display:flex;flex:1;overflow-x:auto;min-width:120px}
.tab{display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{border-color:var(--red);font-weight:600}
.tab button{padding:9px 6px}.tab .x{color:var(--mu);padding:9px 4px}
.dot{color:var(--red)}
.acts{display:flex;flex-wrap:wrap}
.acts button:hover{border-color:var(--bd)}
main{flex:1;display:flex;min-height:0}
aside{width:230px;border-right:1px solid var(--bd);background:var(--tb);overflow:auto;padding:10px;font-size:13px}
aside h3{font:700 13px Georgia,serif;margin:12px 0 4px;color:var(--red)}
aside a{display:block;padding:2px 4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside a:hover,aside a.on{color:var(--red)}
body.noside aside{display:none}
#ws{flex:1;overflow:hidden;background:var(--ed);min-width:0}
#pane{display:flex;height:100%;max-width:var(--w,none);margin:0 auto}
#gut{margin:0;padding:12px 8px 12px 12px;text-align:right;color:var(--mu);overflow:hidden;user-select:none;font:var(--fs,15px)/var(--lh,1.6) var(--ff,monospace);white-space:pre}
body.nogut #gut,body.wrap #gut{display:none}
#ed{flex:1;border:0;resize:none;background:transparent;padding:12px 16px 12px 8px;font:var(--fs,15px)/var(--lh,1.6) var(--ff,monospace);caret-color:var(--red);tab-size:var(--tab,2);white-space:pre;overflow:auto;outline:0}
body.wrap #ed{white-space:pre-wrap;overflow-wrap:break-word}
#ed::selection{background:var(--sel)}
#pv{width:42%;border-left:1px solid var(--bd);overflow:auto;padding:16px 24px;font:16px/1.6 Georgia,serif;background:var(--bg)}
#pv h1,#pv h2,#pv h3{color:var(--red);font-family:Georgia,serif}#pv code,#pv pre{background:var(--tb);padding:1px 4px}#pv pre{padding:8px;overflow:auto}#pv blockquote{border-left:3px solid var(--red);margin:0;padding-left:12px;color:var(--mu)}#pv a{color:var(--red)}
body:not(.prev) #pv{display:none}
body.focus header,body.focus footer,body.focus aside{display:none}
footer{display:flex;gap:16px;border-top:1px solid var(--bd);background:var(--tb);padding:3px 12px;color:var(--mu);font-size:12px;flex-wrap:wrap}
footer .u{color:var(--red)}
body.compact header{min-height:32px}body.compact .tab button{padding:5px 6px}
#fb{display:none;gap:6px;padding:6px 10px;border-bottom:1px solid var(--bd);background:var(--tb);flex-wrap:wrap;align-items:center}
#fb.on{display:flex}
input[type=text],input[type=number],select{background:var(--ed);border:1px solid var(--bd);padding:4px 7px;border-radius:2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:8vh 10px;z-index:10;overflow:auto}
.dlg{background:var(--bg);border:1px solid var(--bd);border-top:3px solid var(--red);width:min(640px,100%);max-height:84vh;overflow:auto;padding:14px 18px}
.dlg h2{font:700 20px Georgia,serif;margin:0 0 10px;display:flex;justify-content:space-between}
.dlg p{margin:6px 0}.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.row>label{min-width:130px}
.btn{border:1px solid var(--bd)}.btn.p{background:var(--red);color:#fff;border-color:var(--red)}.btn.p:hover{background:var(--redd);color:#fff}
.pi{width:100%;margin-bottom:6px;font-size:16px}
.it{display:flex;justify-content:space-between;gap:10px;padding:5px 8px;cursor:pointer;border-left:3px solid transparent}
.it.on{background:var(--sel);border-color:var(--red)}.it small{color:var(--mu)}
.tag{font-size:11px;border:1px solid var(--red);color:var(--red);padding:0 5px}
.err{color:var(--red)}
#toasts{position:fixed;right:12px;bottom:36px;display:flex;flex-direction:column;gap:6px;z-index:20}
.toast{background:var(--tx);color:var(--bg);padding:7px 12px;max-width:340px;border-left:4px solid var(--red)}
kbd{border:1px solid var(--bd);padding:0 5px;font:12px monospace;background:var(--tb)}
@media(max-width:700px){aside{display:none}#pv{position:absolute;inset:80px 0 24px 0;width:auto}.brand span{display:none}}
@media(prefers-reduced-motion:no-preference){.toast{animation:f .2s}@keyframes f{from{opacity:0}}}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i><span>Redact</span></div>
  <nav id="tabs" aria-label="Open documents"></nav>
  <div class="acts" id="acts"></div>
</header>
<div id="fb" role="search" aria-label="Find and replace"></div>
<main>
  <aside id="side" aria-label="Sidebar"></aside>
  <div id="ws"><div id="pane"><pre id="gut" aria-hidden="true"></pre><textarea id="ed" spellcheck="false" aria-label="Editor" autocapitalize="off"></textarea></div></div>
  <div id="pv" aria-label="Markdown preview"></div>
</main>
<footer id="sb" role="status"></footer>
<div id="toasts" aria-live="polite"></div>
<script>
"use strict";
/* ================= Utilities ================= */
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==="class")e.className=v;else if(a==="value"||a==="checked")e[a]=v;else if(a.startsWith("on"))e.addEventListener(a.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(a,v===true?"":v)}e.append(...k.flat().filter(x=>x!=null&&x!==false));return e};
const $=s=>document.querySelector(s);
const isMac=/Mac|iPhone|iPad/.test(navigator.platform);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const keyLabel=c=>c?c.split("+").map(p=>p==="mod"?(isMac?"⌘":"Ctrl"):p==="shift"?"Shift":p==="alt"?(isMac?"⌥":"Alt"):p.length===1?p.toUpperCase():p[0].toUpperCase()+p.slice(1)).join(isMac?"":"+"):"";

/* ================= StorageManager ================= */
const Storage=(()=>{let warned=false;return{
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){if(!warned){warned=true;Notify.show("Browser storage unavailable or full: drafts will not survive a reload.",true)}return false}}
}})();

/* ================= NotificationManager ================= */
const Notify={show(msg,err){const t=h("div",{class:"toast",role:err?"alert":null},msg);$("#toasts").append(t);setTimeout(()=>t.remove(),err?6000:3000)}};

/* ================= EventBus (hooks) ================= */
const Bus={m:new Map(),on(e,f){if(!this.m.has(e))this.m.set(e,new Set());this.m.get(e).add(f);return()=>this.m.get(e).delete(f)},
  emit(e,a){(this.m.get(e)||[]).forEach(f=>{try{f(a)}catch(x){console.error("hook "+e,x);Notify.show("Hook error ("+e+"): "+x.message,true)}})}};

/* ================= SettingsManager ================= */
const Settings=(()=>{const D={theme:"editorial",fontSize:15,lineHeight:1.6,tab:2,spaces:true,wrap:false,lineNumbers:true,font:"mono",width:0,accent:"",compact:false,sidebar:true};
  const FONTS={mono:'ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace',serif:'Georgia,"Times New Roman",serif',sans:'system-ui,"Segoe UI",sans-serif'};
  let v={...D,...Storage.get("redact.settings",{})};
  const api={get:k=>v[k],all:()=>({...v}),FONTS,
    set(k,val){v[k]=val;Storage.set("redact.settings",v);api.apply()},replace(o){v={...D,...o};Storage.set("redact.settings",v);api.apply()},
    apply(){const r=document.documentElement,b=document.body;r.dataset.theme=v.theme;const s=r.style;
      s.setProperty("--fs",v.fontSize+"px");s.setProperty("--lh",v.lineHeight);s.setProperty("--ff",FONTS[v.font]||FONTS.mono);s.setProperty("--tab",v.tab);
      v.width>0?s.setProperty("--w",v.width+"ch"):s.removeProperty("--w");
      v.accent?s.setProperty("--red",v.accent):s.removeProperty("--red");
      b.classList.toggle("wrap",v.wrap);b.classList.toggle("nogut",!v.lineNumbers);b.classList.toggle("compact",v.compact);b.classList.toggle("noside",!v.sidebar)}};
  return api})();

/* ================= ModalManager ================= */
const Modal=(()=>{let stack=[];
  const close=()=>{const o=stack.pop();if(o){o.el.remove();o.onClose&&o.onClose();(stack.length?stack[stack.length-1].el.querySelector("input,button"):$("#ed"))?.focus()}return !!o};
  return{close,any:()=>stack.length>0,
    open(title,body,opts={}){const dlg=h("div",{class:"dlg",role:"dialog","aria-modal":"true","aria-label":title},
        title?h("h2",{},title,h("button",{onclick:close,"aria-label":"Close"},"✕")):null,body);
      const el=h("div",{class:"ov",onmousedown:e=>{if(e.target===el)close()}},dlg);document.body.append(el);stack.push({el,onClose:opts.onClose});
      (dlg.querySelector("input[type=text],input,button.p")||dlg.querySelector("button"))?.focus();return el},
    confirm(msg,okLabel="OK"){return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};
      const b=h("div",{},h("p",{},msg),h("div",{class:"row"},h("button",{class:"btn p",onclick:()=>{fin(true);close()}},okLabel),h("button",{class:"btn",onclick:()=>{fin(false);close()}},"Cancel")));
      this.open("Confirm",b,{onClose:()=>fin(false)})})},
    /* Minibuffer-style prompt: one input, resolves with string or null */
    ask(label,def=""){return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};
      const i=h("input",{type:"text",class:"pi",value:def,"aria-label":label,onkeydown:e=>{if(e.key==="Enter"){fin(i.value);close()}}});
      this.open(label,i,{onClose:()=>fin(null)});i.select()})}};
})();

/* ================= CommandRegistry + ShortcutManager ================= */
const Commands=(()=>{const m=new Map();let recent=Storage.get("redact.recent",[]);
  return{m,
    add(id,spec,owner="core"){if(m.has(id))throw new Error("Command already registered: "+id);m.set(id,{id,category:"General",...spec,owner});return()=>m.delete(id)},
    run(id,arg){const c=m.get(id);if(!c){Notify.show("Unknown command: "+id,true);return}
      try{if(c.enabled&&!c.enabled()){Notify.show(c.label+" is not available right now.");return}
        const r=c.run(arg);if(r&&r.catch)r.catch(e=>Notify.show(c.label+": "+e.message,true));
        recent=[id,...recent.filter(x=>x!==id)].slice(0,8);Storage.set("redact.recent",recent);Bus.emit("command",id)}
      catch(e){console.error(e);Notify.show(c.label+" failed: "+e.message,true)}},
    recent:()=>recent};
})();
const Keys=(()=>{let over=Storage.get("redact.keys",{}),map=new Map(),recorder=null;
  const combo=e=>{if(["Control","Meta","Shift","Alt"].includes(e.key))return"";
    let k=e.code.startsWith("Key")?e.code.slice(3).toLowerCase():e.code.startsWith("Digit")?e.code.slice(5):e.key.toLowerCase();
    let shift=e.shiftKey;if(k==="+"||e.code==="Equal"||e.code==="NumpadAdd"){k="=";shift=false}if(e.code==="NumpadSubtract")k="-";if(k===" ")k="space";
    return[(e.ctrlKey||e.metaKey)&&"mod",e.altKey&&"alt",shift&&"shift",k].filter(Boolean).join("+")};
  const api={combo,
    keyOf(id){return id in over?over[id]:Commands.m.get(id)?.key||null},
    rebuild(){map.clear();for(const c of Commands.m.values()){const k=api.keyOf(c.id);if(k&&!map.has(k))map.set(k,c.id)}},
    conflict(k,except){for(const c of Commands.m.values())if(c.id!==except&&api.keyOf(c.id)===k)return c;return null},
    set(id,k){over[id]=k;Storage.set("redact.keys",over);api.rebuild()},
    reset(){over={};Storage.set("redact.keys",over);api.rebuild()},
    overrides:()=>over,setOverrides(o){over=o||{};Storage.set("redact.keys",over);api.rebuild()},
    record(f){recorder=f},
    init(){window.addEventListener("keydown",e=>{if(e.isComposing||e.keyCode===229)return;const c=combo(e);if(!c)return;
      if(recorder){e.preventDefault();e.stopPropagation();const r=recorder;recorder=null;r(c);return}
      if(c==="escape"){if(Modal.any()){e.preventDefault();Modal.close()}else if($("#fb").classList.contains("on")){Find.hide()}return}
      const id=map.get(c);if(!id)return;e.preventDefault();Commands.run(id)},true)}};
  return api})();

/* ================= DocumentManager ================= */
const Docs=(()=>{let list=[],cur=0,seq=1;
  const mk=(name,text="",extra={})=>({id:"d"+Date.now()+(seq++),name,text,saved:text,disk:false,handle:null,...extra});
  const WELCOME="# Welcome to Redact\n\nA small, extensible writing and code editor that runs from one HTML file.\n\n- Press "+(isMac?"⌘":"Ctrl+")+"Shift+P for the command palette: every feature is a command.\n- Open the Extensions manager to enable, remove, or install your own.\n- Drafts are kept in this browser. Use Save to write a real file.\n\nTry **Toggle preview** to see this page rendered.\n \n You can use next online extensions:\n - spell-grammar.js \n - exam-paper.js \n - export-pdf.js \n - export-slides-pdf.js \n - pseudocode.js \n - pseudocode_to_pdf.js \n - scientific-paper.js \n"
  const st=Storage.get("redact.docs",null);
  if(st&&st.docs?.length){list=st.docs.map(d=>({handle:null,...d}));cur=Math.min(st.cur||0,list.length-1)}else list=[mk("Welcome.md",WELCOME,{saved:WELCOME})];
  const persist=debounce(()=>Storage.set("redact.docs",{cur,docs:list.map(({id,name,text,saved,disk})=>({id,name,text,saved,disk}))}),400);
  const api={list:()=>list,get cur(){return list[cur]},index:()=>cur,persist,mk,
    dirty:d=>d.text!==d.saved,
    modeOf:d=>{const e=(d.name.split(".").pop()||"").toLowerCase();return{md:"Markdown",markdown:"Markdown",json:"JSON",js:"JavaScript",html:"HTML",css:"CSS"}[e]||"Text"},
    add(name,text,extra){const d=mk(name,text,extra);list.push(d);api.switch(list.length-1);return d},
    switch(i){if(i<0||i>=list.length)return;cur=i;UI.load();Bus.emit("switch",list[cur]);persist()},
    async close(i){const d=list[i];if(api.dirty(d)&&!await Modal.confirm('"'+d.name+'" has unsaved changes. Discard them?',"Discard"))return;
      list.splice(i,1);if(!list.length)list.push(mk("untitled.txt"));cur=Math.min(i<cur?cur-1:cur,list.length-1);UI.load();persist();Bus.emit("close",d)}};
  return api})();

/* ================= EditorCore ================= */
const Ed=(()=>{const ta=$("#ed");
  const api={ta,
    text:()=>ta.value,sel:()=>[ta.selectionStart,ta.selectionEnd],
    /* Edits go through execCommand so the browser's native undo stack stays intact */
    replace(s,e,t){ta.focus();ta.setSelectionRange(s,e);let ok=false;try{ok=t===""?(s===e||document.execCommand("delete")):document.execCommand("insertText",false,t)}catch(x){}
      if(!ok||ta.value.length!==ta._len-(e-s)+t.length&&false){}
      if(!ok){ta.setRangeText(t,s,e,"end");ta.dispatchEvent(new Event("input",{bubbles:true}))}},
    select(s,e){ta.setSelectionRange(s,e)},
    selected(){return ta.value.slice(ta.selectionStart,ta.selectionEnd)},
    lineBounds(s,e){const t=ta.value;let a=t.lastIndexOf("\n",s-1)+1,b=t.indexOf("\n",e);if(b<0)b=t.length;return[a,b]},
    /* Apply fn to selection, or the whole document when nothing is selected */
    transform(fn){let[s,e]=api.sel();if(s===e){s=0;e=ta.value.length}const out=fn(ta.value.slice(s,e));api.replace(s,e,out);api.select(s,s+out.length)},
    indentUnit:()=>Settings.get("spaces")?" ".repeat(Settings.get("tab")):"\t",
    indentLines(dir){const[s,e]=api.sel(),[a,b]=api.lineBounds(s,e),u=api.indentUnit(),re=new RegExp("^(\\t| {1,"+Settings.get("tab")+"})");
      const out=ta.value.slice(a,b).split("\n").map(l=>dir>0?u+l:l.replace(re,"")).join("\n");api.replace(a,b,out);api.select(a,a+out.length)},
    gotoLine(n,c=1){const L=ta.value.split("\n");n=Math.max(1,Math.min(n,L.length));let p=0;for(let i=0;i<n-1;i++)p+=L[i].length+1;p+=Math.min(c-1,L[n-1].length);ta.focus();ta.setSelectionRange(p,p);api.reveal(n-1)},
    reveal(line){const lh=parseFloat(getComputedStyle(ta).lineHeight)||20;ta.scrollTop=Math.max(0,line*lh-ta.clientHeight/2)},
    pos(){const p=ta.selectionStart,b=ta.value.slice(0,p);let n=1;for(let i=b.indexOf("\n");i>=0;i=b.indexOf("\n",i+1))n++;return[n,p-b.lastIndexOf("\n")]},
    words:t=>(t.match(/\S+/g)||[]).length};
  return api})();

/* ================= UI (tabs, gutter, status, sidebar) ================= */
const statusItems=new Map(),panels=new Map();
const UI=(()=>{let lines=0;
  const gut=$("#gut"),ta=Ed.ta;
  const api={
    load(){const d=Docs.cur;ta.value=d.text;lines=0;api.gutter();api.tabs();api.status();api.side();api.preview();ta.scrollTop=0;if(!document.activeElement||document.activeElement===document.body)ta.focus()},
    gutter(){const n=ta.value.split("\n").length;if(n!==lines){lines=n;let s="";for(let i=1;i<=n;i++)s+=i+"\n";gut.textContent=s}gut.scrollTop=ta.scrollTop},
    tabs(){const t=$("#tabs");t.replaceChildren(...Docs.list().map((d,i)=>h("div",{class:"tab"+(i===Docs.index()?" on":"")},
        h("button",{onclick:()=>Docs.switch(i),"aria-current":i===Docs.index()?"true":null,title:d.name},d.name,Docs.dirty(d)?h("span",{class:"dot",title:"Unsaved changes"}," ●"):""),
        h("button",{class:"x",onclick:()=>Docs.close(i),"aria-label":"Close "+d.name},"×"))));document.title=(Docs.dirty(Docs.cur)?"● ":"")+Docs.cur.name+" – Redact"},
    status(){const d=Docs.cur,[l,c]=Ed.pos(),sb=$("#sb"),dirty=Docs.dirty(d);
      const items=[h("span",{},"Ln "+l+", Col "+c),h("span",{},lines+" lines"),h("span",{},Docs.modeOf(d)),h("span",{},(Settings.get("spaces")?"Spaces: ":"Tab size: ")+Settings.get("tab")),h("span",{},"UTF-8")];
      for(const[k,f]of statusItems){try{items.push(h("span",{title:k},f()))}catch(e){}}
      items.push(h("span",{class:dirty?"u":""},dirty?"● Unsaved (draft in browser)":d.disk?"Saved to file":"Not saved to disk"));sb.replaceChildren(...items)},
    side(){const s=$("#side");if(!Settings.get("sidebar"))return;const out=[h("h3",{},"Documents"),...Docs.list().map((d,i)=>h("a",{class:i===Docs.index()?"on":"",onclick:()=>Docs.switch(i)},d.name))];
      for(const[,p]of panels){try{const box=h("div",{});p.render(box);out.push(h("h3",{},p.title),box)}catch(e){}}s.replaceChildren(...out)},
    preview(){if(document.body.classList.contains("prev"))$("#pv").innerHTML=Markdown(ta.value)}};
  ta.addEventListener("scroll",()=>gut.scrollTop=ta.scrollTop);
  const light=debounce(()=>{api.side();api.preview()},250);
  ta.addEventListener("input",()=>{if(ta._comp)return;Docs.cur.text=ta.value;api.gutter();api.tabs();api.status();light();Docs.persist();Bus.emit("change",Docs.cur)});
  ta.addEventListener("compositionstart",()=>ta._comp=1);ta.addEventListener("compositionend",()=>{ta._comp=0;ta.dispatchEvent(new Event("input"))});
  document.addEventListener("selectionchange",()=>{if(document.activeElement===ta)requestAnimationFrame(api.status)});
  /* Editor-local keys: Tab indent, Enter auto-indent */
  ta.addEventListener("keydown",e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key==="Tab"){e.preventDefault();const[s,t]=Ed.sel();if(e.shiftKey||ta.value.slice(s,t).includes("\n"))Ed.indentLines(e.shiftKey?-1:1);else Ed.replace(s,t,Ed.indentUnit())}
    else if(e.key==="Enter"&&!e.shiftKey){const[s,t]=Ed.sel(),[a]=Ed.lineBounds(s,s),ind=ta.value.slice(a,s).match(/^[ \t]*/)[0];if(ind){e.preventDefault();Ed.replace(s,t,"\n"+ind)}}});
  return api})();

/* ================= Markdown (escape first, then format; links limited to http/https) ================= */
function Markdown(src){const inl=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  let out="",inCode=false,ul=false,para=[];const fp=()=>{if(para.length)out+="<p>"+inl(para.join(" "))+"</p>";para=[]},fu=()=>{if(ul)out+="</ul>";ul=false};
  for(const l of src.split("\n")){if(/^```/.test(l)){fp();fu();out+=inCode?"</pre>":"<pre>";inCode=!inCode;continue}
    if(inCode){out+=esc(l)+"\n";continue}let m;
    if((m=l.match(/^(#{1,6})\s+(.*)/))){fp();fu();out+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
    else if((m=l.match(/^\s*[-*]\s+(.*)/))){fp();if(!ul){out+="<ul>";ul=true}out+="<li>"+inl(m[1])+"</li>"}
    else if((m=l.match(/^>\s?(.*)/))){fp();fu();out+="<blockquote>"+inl(m[1])+"</blockquote>"}
    else if(!l.trim()){fp();fu()}else{fu();para.push(l)}}
  fp();fu();if(inCode)out+="</pre>";return out}

/* ================= Built-in extensions ================= */
const rd=(i,e,f)=>f(i,e);
const fix=s=>s.replace(/\r\n?/g,"\n");
editor.registerExtension({id:"word-counter",name:"Word Counter",version:"1.0.0",author:"Redact",description:"Live words, characters and reading time in the status bar.",
  activate(api){api.addStatus("w",()=>{const t=api.editor.text(),w=api.editor.words(t);return w+" words · "+t.length+" chars · "+Math.max(1,Math.round(w/230))+" min read"});
    api.on("change",()=>UI.status());
    api.registerCommand("stats",{label:"Show document statistics",run(){const t=api.editor.text();api.notify(t.length+" characters, "+api.editor.words(t)+" words, "+t.split("\n").length+" lines, "+(t.trim()?t.trim().split(/\n\s*\n/).length:0)+" paragraphs")}})}});
editor.registerExtension({id:"text-tools",name:"Text and Line Tools",version:"1.0.0",author:"Redact",description:"Case changes, sorting, de-duplication, trimming and line operations.",
  activate(api){const E=api.editor,T=(id,label,fn,key)=>api.registerCommand(id,{label,key,run:()=>E.transform(fn)});
    T("upper","Uppercase",s=>s.toUpperCase());T("lower","Lowercase",s=>s.toLowerCase());
    T("title","Title case",s=>s.toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()));
    T("trim","Trim trailing whitespace",s=>s.replace(/[ \t]+$/gm,""));T("sort","Sort lines",s=>s.split("\n").sort((a,b)=>a.localeCompare(b)).join("\n"));
    T("dedupe","Remove duplicate lines",s=>[...new Set(s.split("\n"))].join("\n"));T("join","Join lines",s=>s.split("\n").map(x=>x.trim()).join(" "));
    T("tabs2spaces","Convert tabs to spaces",s=>s.replace(/\t/g," ".repeat(Settings.get("tab"))));T("spaces2tabs","Convert leading spaces to tabs",s=>s.replace(new RegExp("^((?: {"+Settings.get("tab")+"})+)","gm"),m=>"\t".repeat(m.length/Settings.get("tab"))));
    api.registerCommand("indent",{label:"Indent lines",run:()=>E.indentLines(1)});api.registerCommand("outdent",{label:"Outdent lines",run:()=>E.indentLines(-1)});
    api.registerCommand("dup",{label:"Duplicate line",key:"mod+shift+d",run(){const[s,e]=E.sel(),[a,b]=E.lineBounds(s,e),blk=E.text().slice(a,b);E.replace(b,b,"\n"+blk);E.select(s+blk.length+1,e+blk.length+1)}});
    api.registerCommand("del",{label:"Delete line",key:"mod+shift+k",run(){const[s,e]=E.sel(),[a,b]=E.lineBounds(s,e);E.replace(a,Math.min(b+1,E.text().length),"")}});
    api.registerCommand("up",{label:"Move line up",key:"alt+arrowup",run(){const t=E.text(),[s,e]=E.sel(),[a,b]=E.lineBounds(s,e);if(!a)return;const p=t.lastIndexOf("\n",a-2)+1,blk=t.slice(a,b);E.replace(p,b,blk+"\n"+t.slice(p,a-1));E.select(p+(s-a),p+(e-a))}});
    api.registerCommand("down",{label:"Move line down",key:"alt+arrowdown",run(){const t=E.text(),[s,e]=E.sel(),[a,b]=E.lineBounds(s,e);if(b>=t.length)return;let n=t.indexOf("\n",b+1);if(n<0)n=t.length;const nx=t.slice(b+1,n);E.replace(a,n,nx+"\n"+t.slice(a,b));E.select(a+nx.length+1+(s-a),a+nx.length+1+(e-a))}})}});
editor.registerExtension({id:"json-tools",name:"JSON Formatter",version:"1.0.0",author:"Redact",description:"Format, minify and validate JSON in the selection or document.",
  activate(api){const E=api.editor,J=(id,label,fn)=>api.registerCommand(id,{label,run(){try{E.transform(s=>fn(JSON.parse(s)))}catch(e){api.notify("Invalid JSON: "+e.message,true)}}});
    J("format","Format JSON",o=>JSON.stringify(o,null,Settings.get("tab")));J("minify","Minify JSON",o=>JSON.stringify(o));
    api.registerCommand("validate",{label:"Validate JSON",run(){try{JSON.parse(E.selected()||E.text());api.notify("Valid JSON")}catch(e){api.notify("Invalid JSON: "+e.message,true)}}})}});
editor.registerExtension({id:"datetime",name:"Date and Time",version:"1.0.0",author:"Redact",description:"Insert dates and timestamps at the cursor.",
  activate(api){const I=(id,l,f)=>api.registerCommand(id,{label:l,run(){const[s,e]=api.editor.sel();api.editor.replace(s,e,f(new Date()))}});
    I("iso","Insert ISO date",d=>d.toISOString().slice(0,10));I("stamp","Insert date and time",d=>d.toLocaleString());I("utc","Insert UTC timestamp",d=>d.toISOString())}});
editor.registerExtension({id:"outline",name:"Document Outline",version:"1.0.0",author:"Redact",description:"Sidebar list of Markdown headings; click to jump.",
  activate(api){api.addPanel("o","Outline",box=>{const L=api.editor.text().split("\n");let any=false;L.forEach((l,i)=>{const m=l.match(/^(#{1,6})\s+(.*)/);if(m){any=true;box.append(h("a",{style:"padding-left:"+(m[1].length-1)*10+"px",onclick:()=>api.editor.gotoLine(i+1)},m[2]))}});if(!any)box.append(h("small",{style:"color:var(--mu)"},"No headings. Start a line with # to add one."))})}});
editor.registerExtension({id:"find-docs",name:"Find in Documents",version:"1.0.0",author:"Redact",description:"Search text across all open documents.",
  activate(api){api.registerCommand("find",{label:"Find in open documents",async run(){const q=await api.prompt("Search all open documents","");if(!q)return;const hits=[];
      api.docs().forEach((d,i)=>d.text.split("\n").forEach((l,n)=>{if(l.toLowerCase().includes(q.toLowerCase())&&hits.length<200)hits.push({i,n,l,name:d.name})}));
      Modal.open("Results for “"+q+"”",h("div",{},hits.length?hits.map(x=>h("div",{class:"it",onclick:()=>{Modal.close();Docs.switch(x.i);Ed.gotoLine(x.n+1)}},h("span",{},h("small",{},x.name+":"+(x.n+1)+"  "),x.l.trim().slice(0,90)))):h("p",{},"No matches in open documents.")))}})}});
editor.registerExtension({id:"scratchpad",name:"Scratchpad",version:"1.0.0",author:"Redact",description:"A persistent scratch document for temporary notes.",
  activate(api){api.registerCommand("open",{label:"Open scratch document",key:"mod+shift+j",run(){const i=api.docs().findIndex(d=>d.name==="*scratch*");i>=0?Docs.switch(i):api.openDoc("*scratch*","")}})}});
editor.registerExtension({id:"dev-utils",name:"Developer Utilities",version:"1.0.0",author:"Redact",description:"Inspect the selection: length, lines, code points.",
  activate(api){api.registerCommand("inspect",{label:"Inspect selection",run(){const s=api.editor.selected();api.notify(s?s.length+" chars, "+[...s].length+" code points, "+s.split("\n").length+" lines, "+api.editor.words(s)+" words":"Nothing selected")}})}});

/* ================= Boot ================= */
(function init(){
  const bar=$("#acts");
  [["New","file.new"],["Open","file.open"],["Save","file.save"],["Find","nav.find"],["Preview","view.preview"],["Commands","nav.palette"],["Extensions","prefs.extensions"],["Settings","prefs.settings"],["Help","prefs.help"]]
    .forEach(([l,id])=>bar.append(h("button",{onclick:()=>Commands.run(id),title:Commands.m.get(id).label+(Commands.m.get(id).key?" ("+keyLabel(Commands.m.get(id).key)+")":"")},l)));
  const ts=h("select",{"aria-label":"Theme",onchange:e=>Settings.set("theme",e.target.value)},[["editorial","Editorial Red"],["midnight","Midnight"],["paper","Paper"],["contrast","High Contrast"]].map(([v,n])=>h("option",{value:v,selected:Settings.get("theme")===v},n)));
  bar.append(ts);
  Settings.apply();Plugins.startup();Keys.rebuild();Keys.init();UI.load();
  window.addEventListener("beforeunload",e=>{if(Docs.list().some(Docs.dirty)){e.preventDefault();e.returnValue=""}});
  if(!Storage.set("redact.probe",1))Notify.show("Storage is unavailable: nothing will be restored after reload.",true);
})();
</script>
</body>
